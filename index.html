const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function unlock(phrase) {
  const salt = b64(BLOB.salt), iv = b64(BLOB.iv), ct = b64(BLOB.ct), mac = b64(BLOB.mac);
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(phrase), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", salt, iterations: BLOB.rounds, hash: "SHA-256" }, base, 512));
  const macKey = await crypto.subtle.importKey("raw", bits.slice(32), { name: "HMAC", hash: "SHA-256" }, false, ["verify"]);
  const signed = new Uint8Array(iv.length + ct.length); signed.set(iv); signed.set(ct, iv.length);
  if (!(await crypto.subtle.verify("HMAC", macKey, mac, signed))) throw new Error("wrong passphrase");

function show(html) { document.open(); document.write(html); document.close(); }
const form = document.getElementById("f"), msg = document.getElementById("msg");
let saved = null; try { saved = localStorage.getItem("aosKey"); } catch (e) {}
(async () => {

form.addEventListener("submit", async (e) => {
  e.preventDefault(); msg.textContent = "Opening…";
  const phrase = document.getElementById("k").value.trim();
  try { const html = await unlock(phrase); try { localStorage.setItem("aosKey", phrase); } catch (e2) {} show(html); }

});
